<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <header>
        <section>
            <h1>Formulários</h1>
        </section>
    </header>
    <main>
        <Section>
            <form action="cadastro.php" method="post">
                <p><label>Nome:</label></p>
                <input type="text" name="nome" required placeholder="Digite seu nome" >
                <br>
                <p><label>Senha:</label></p>
                <input type="password" name="senha" required maxlength="8" placeholder="Digite sua senha">
                <br>
                <p><label>Email:</label></p>
                <input type="email" name="email" required placeholder="Digite seu email">
                <br>
                <p><label>Telefone:</label></p>
                <input type="text" name="Telefone" required placeholder="Digite seu telefone"
                    title="Use o formato (99) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
                <br>
                <p><label>CEP:</label></p>
                <input type="text" name="CEP" required  placeholder="Digite seu CEP" pattern="[0-9]{5}-[0-9]{3}">

                <p><label>Sobre você:</label></p>
                <textarea name="bio" rows="10" cols="100" placeholder="Fale sobre você"></textarea>

                <p><label>Gênero:</label></p>
                <input type="radio" name="genero" value="M">Masculino
                <input type="radio" name="genero" value="F">Feminino

                <p><label>Interesses:</label></p>
                <input type="checkbox" name="interesses" value="tecnologia">Tecnologia
                <input type="checkbox" name="interesses" value="esportes">Esportes
                <input type="checkbox" name="interesses" value="artes">Artes

                <p><label>País:</label></p>
                <select name="pais">
                    <option value="">---</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                </select>

                <p><label>Foto de perfil:</label></p>
                <input type="file" name="foto">
                <br> <br>
                <input type="submit" value="Enviar">
                <input type="reset" value="Resetar"
            </form>
        </Section>
    </main>
</body>

</html>
