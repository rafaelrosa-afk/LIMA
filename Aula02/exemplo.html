<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos - Aula 2</title>
</head>

<body>
    <div style="border:1px solid black; padding:10px;text-align: center;">
        <h2> Notícia do dia</h2>
        <p style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Hoje tivemos um evento importante</p>
        <p>Este é um <span style="color:red; font-size:25px"> aviso importante </span> no meio do texto. </p>
    </div>
    <hr>
    <header>
        <b> HEADER</b> - <i>CABEÇALHO</i>
    </header>
    <main>
        <strong>MAIN</strong> - <em>PARTE PRINCIPAL</em>
    </main>
    <footer>
        FOOTER - RODAPÉ
    </footer>

    <br>

    <p>E=mc<sup>2</sup></p>

    <p>H<sub>2</sub>O</p>
    <hr>
    <p style="text-align: left;">Texto alinhado a esquerda</p>
    <p style="text-align: center;">Texto centralizado</p>
    <p style="text-align: right;">Texto alinhado a direita</p>
    <p style="text-align: justify;"> Texto justificado, preenchendo a largura da linha</p>
</body>

</html>
