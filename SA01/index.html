<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - SENAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1f2421;
        }

        /* Cabeçalho e Linha de Destaque */
        header {
            border-bottom: 4px solid #005b5c;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 32px;
            font-weight: bold;
            color: #005b5c;
            letter-spacing: 1px;
        }

        .logo-title span {
            color: #e2a800;
        }

        .logo-sub {
            font-size: 8px;
            color: #005b5c;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Navegação */
        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav a {
            text-decoration: none;
            color: #1f2421;
            font-size: 18px;
            font-weight: 500;
            padding-bottom: 5px;
        }

        nav a.active,
        nav a:hover {
            border-bottom: 2px solid #005b5c;
            font-weight: bold;
        }

        /* Conteúdo Principal */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Estilo dos Cards */
        .card {
            border: 2px solid #8ca8a1;
            border-radius: 2px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #ffffff;
        }

        .card h2 {
            font-size: 20px;
            font-weight: normal;
            color: #1f2421;
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
        }

        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        /* Botão Inscreva-se */
        .btn-subscribe {
            display: block;
            background-color: #8ca8a1;
            color: #1f2421;
            text-decoration: none;
            padding: 12px 0;
            font-size: 18px;
            font-weight: 500;
            border: none;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        .btn-subscribe:hover {
            background-color: #72938c;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <div class="logo-title">SE<span>N</span>AI</div>
            <div class="logo-sub">SERVIÇO NACIONAL DE APRENDIZAGEM INDUSTRIAL</div>
        </div>
        <nav>
            <ul>
                <li><a href="#inicio">Início</a></li>

                <li><a href="#unidades">Unidades</a></li>
                <li><a href="#fale-conosco">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="courses-grid">
            <!-- Curso 1 -->
            <article class="card">
                <h2>Desenvolvimento de Sistemas</h2>
                <img src="img/Ìnicio.png" alt="Desenvolvimento de Sistemas" class="card-image">
                <a href="#inscreva-se" class="btn-subscribe">Inscreva-se</a>
            </article>

            <!-- Curso 2 -->
            <article class="card">
                <h2>Logística</h2>
                <img src="img/Ìnicio (1).png" alt="Logística" class="card-image">
                <a href="#inscreva-se" class="btn-subscribe">Inscreva-se</a>
            </article>

            <!-- Curso 3 -->
            <article class="card">
                <h2>Qualidade de Vida</h2>
                <img src="img/Ìnicio (2).png" alt="Qualidade de Vida" class="card-image">
                <a href="#inscreva-se" class="btn-subscribe">Inscreva-se</a>
            </article>
        </section>
        <br><br>
        <section>

            <form action="cadastro.php" method="post">
                <p><label>Nome:</label></p>
                <input type="text" name="nome" required placeholder="Digite seu nome">
                <br><br>
                <p><label>Email:</label></p>
                <input type="email" name="email" required placeholder="Digite seu email">
                <br><br>
                <p><label>Telefone:</label></p>
                <input type="text" name="Telefone" required placeholder="Digite seu telefone"
                    title="Use o formato (99) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">

                <br> <br>
                <input type="submit" value="Enviar">
                <input type="reset" value="Resetar" </form>

</body>

</html>
