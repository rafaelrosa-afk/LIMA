<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramação de elementos</title>
<style>
    .container {
        width: 400px;
        height: 600px;
       border: 5px solid black;
    }
    img{
        width: 100px;
        height: 100px;
        background-color: dodgerblue;
    }
    span{
        font-size: 20px;
        vertical-align: top;
    }
    .item1{
        width: 150px;
        height: 150px;
        background-color: red;
        display: inline-block;

    }
    .item2{
        width: 150px;
        height: 150px;
        background-color: blue;
        display: inline-block;
    }
</style>
</head>
<body>
    <div class="container">
        <p> lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. </p>
        <button>lorem</button>
    <div>
        <img>
        <span>Exemplo vertical-align</span>
        <div class="item1"> </div>
        <div class="item2"> </div>
    </div>
    </div>
</body>
</html>
